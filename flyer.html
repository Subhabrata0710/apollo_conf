<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Flyer | ABC Children’s Conclave</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <style>
        .flyer-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
            min-height: calc(100vh - 200px);
            background-color: var(--light-grey);
        }

        .flyer-image {
            max-width: 100%;
            height: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <!-- NAVIGATION -->
    <div id="navbar-placeholder"></div>
    <marquee class="cme-marquee" scrollamount="15" direction="left" onmouseover="this.stop();"
        onmouseout="this.start();">10 CME Point approved by WBMC | Registration closed.</marquee>

    <!-- MAIN CONTENT -->
    <main class="flyer-container">
        <img src="images/closed.jpg" alt="Flyer" class="flyer-image">
    </main>

    <!-- FOOTER -->
    <div id="footer-placeholder"></div>

    <script src="script.js"></script>
</body>

</html>
